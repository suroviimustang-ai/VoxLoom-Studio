name: Bug report
description: Report a reproducible problem without private recordings.
body:
  - type: input
    id: version
    attributes:
      label: VoxLoom version, operating system and architecture
      description: For example, VoxLoom 0.2.2 on Windows 11 x64, macOS 15 ARM64 or Ubuntu 24.04 x64.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected behavior and actual behavior
      description: Include format, sample rate, channels and model. Do not attach private audio.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Error message and reviewed diagnostics
      description: Remove private paths before posting.
